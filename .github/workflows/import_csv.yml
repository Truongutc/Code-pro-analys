name: Import New Data

on:
  workflow_dispatch: # Enable manual run button in GitHub Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Restore Cached Stock Data
        uses: actions/cache@v3
        with:
          path: |
            data_storage/
            config.json
          key: stock-data-import-${{ github.run_id }}
          restore-keys: |
            stock-data-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Import Script
        run: |
          if [ -d "import_data" ] && [ "$(ls -A import_data/*.csv 2>/dev/null)" ]; then
              echo "=== PHÁT HIỆN THƯ MỤC import_data/ CHỨA FILE CSV. BẮT ĐẦU NẠP DỮ LIỆU BAN ĐẦU ==="
              python run_headless_update.py --import-csv import_data/
          elif [ -f "import_data.csv" ]; then
              echo "=== PHÁT HIỆN FILE import_data.csv. BẮT ĐẦU NẠP DỮ LIỆU BAN ĐẦU ==="
              python run_headless_update.py --import-csv import_data.csv
          else
              echo "❌ Không tìm thấy thư mục import_data/ hoặc file import_data.csv để nạp!"
              exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only the Output/ directory (data_storage/ and config.json are handled by GitHub cache)
          git add Output/
          
          if ! git diff --cached --quiet; then
            git commit -m "Import stock data from CSV: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes in stock data. Skipping push."
          fi
