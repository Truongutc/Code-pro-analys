name: Auto Update Stock Data

on:
  schedule:
    # 12:00 PM ICT is 05:00 UTC (weekdays Monday to Friday)
    - cron: '0 5 * * 1-5'
    # 15:30 (3:30 PM) ICT is 08:30 UTC (weekdays Monday to Friday)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Enable manual run button in GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Restore Cached Stock Data
        uses: actions/cache@v3
        with:
          path: |
            data_storage/
            config.json
          key: stock-data-${{ github.run_id }}
          restore-keys: |
            stock-data-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Update Script
        env:
          PYTHONPATH: .
          VIETSTOCK_CURL: ${{ secrets.VIETSTOCK_CURL }}
        run: |
          # 1. Cấu hình cURL từ secrets
          python -c '
          import os
          from tinvest.config_manager import ConfigManager
          curl_str = os.environ.get("VIETSTOCK_CURL")
          if curl_str and len(curl_str.strip()) > 10:
              print("Found VIETSTOCK_CURL secret. Parsing and updating config...")
              mgr = ConfigManager()
              success = mgr.parse_input(curl_str)
              if success:
                  print("Config successfully updated with new cURL credentials!")
              else:
                  print("Failed to parse cURL credentials.")
          else:
              print("No VIETSTOCK_CURL secret provided or it is too short. Proceeding with existing config.")
          '
          
          # 2. Tự động nạp dữ liệu ban đầu bằng CSV nếu người dùng đẩy thư mục hoặc file CSV lên Git
          if [ -d "import_data" ] && [ "$(ls -A import_data/*.csv 2>/dev/null)" ]; then
              echo "=== PHÁT HIỆN THƯ MỤC import_data/ CHỨA FILE CSV. BẮT ĐẦU NẠP DỮ LIỆU BAN ĐẦU ==="
              python run_headless_update.py --import-csv import_data/
          elif [ -f "import_data.csv" ]; then
              echo "=== PHÁT HIỆN FILE import_data.csv. BẮT ĐẦU NẠP DỮ LIỆU BAN ĐẦU ==="
              python run_headless_update.py --import-csv import_data.csv
          fi
          
          # 3. Chạy cập nhật tự động hàng ngày từ Vietstock
          python run_headless_update.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only the Output/ directory (data_storage/ and config.json are handled by GitHub cache)
          git add Output/
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update stock analysis: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes in stock data. Skipping push."
          fi
